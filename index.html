<meta charset="utf-8">
<title>UNIVERSE</title>

<style>
/* ============================================================
   第一区：外观（颜色、字体、间距）
   想改网站的样子，先改这里。改一个值，全站一起变。
   布局思路：顶部一条导航，下面一栏内容，最宽 880px。
   ============================================================ */
:root {
  --bg: #E9DFD0;          /* 页面背景：带灰的米色 */
  --surface: #F2EADC;     /* 卡片背景 */
  --ink: #3A2E2A;         /* 正文文字：深褐，像油画里的暗部 */
  --muted: #7C6A62;       /* 次要文字 */
  --line: #D6C8B4;        /* 分隔线和边框：香槟色 */
  --accent: #8A6A2F;      /* 强调色：古金。按钮、链接 */
  --accent-soft: #E6D7BE; /* 强调色的浅底：香槟 */
  --on-accent: #FFFDF8;   /* 强调色上面的文字 */
  --card-warm: #E6DAC6;   /* 登录、注册卡片的底色：带灰的暖香槟 */
  --east-page: #DEC6BD;   /* 东玄页的背景：淡的檀红，偏东方传统 */
  --west-page: #CEC7E0;   /* 西玄页的背景：淡的蓝紫，像藤花 */
  --gilt-deep: #8F6E2E;   /* 有颜色的背景上用的深一些的金线 */
  --gilt-on-dark: rgba(240, 220, 170, 0.75); /* 深色长条和首页板块里的描金线 */
  --font-latin: "Didot", "Bodoni MT", "Garamond", "Times New Roman", Georgia, serif; /* 英文名 UNIVERSE 用的字体 */
  --sheen-hi: rgba(255, 255, 255, 0.10);  /* 长条左上的一点亮光，像油彩的光泽 */
  --sheen-lo: rgba(0, 0, 0, 0.14);        /* 长条右下的一点暗 */
  --tone-muted: #5C4B46;  /* 东玄、西玄页上的次要文字，比平时深一些才看得清 */
  --tone-line: rgba(58, 46, 42, 0.28); /* 东玄、西玄页上的分隔线 */
  --veil: rgba(255, 244, 230, 0.16);      /* 登录页背景图上的一层暖光，数字越大越亮越淡 */
  --bar-glass: #EFE6D7;                      /* 登录页顶部导航的底色：实色，不透明 */
  --gilt: #C9A765;        /* 描金细线 */
  --gilt-soft: rgba(201, 167, 101, 0.5);  /* 淡一些的描金细线 */
  --blush: #EBD3CF;       /* 粉色：头像的底色 */
  --blush-ink: #8A4F4A;   /* 粉色上面的字 */
  --blush-wash: rgba(235, 211, 207, 0.4); /* 页面角落的一抹粉 */
  --pearl: rgba(255, 252, 245, 0.45);      /* 页面角落的珍珠光 */
  --danger: #A8321F;      /* 错误提示 */
  --on-image: #FFFFFF;    /* 图片上面的文字 */
  --image-base: #1B2430;  /* 图片没加载出来时的底色 */

  /* 首页专用的颜色。首页有星云背景，所以这一组不分深浅模式 */
  --night: #2A2038;                          /* 星云图没加载出来时的底色 */
  --scrim-top: rgba(42, 30, 60, 0.42);       /* 盖在星云图上方的暗色，最后一个数字越大图越暗 */
  --scrim-bottom: rgba(42, 30, 60, 0.55);    /* 盖在星云图下方的暗色 */
  --east: rgba(150, 92, 88, 0.42);           /* 东玄板块的底色：暖玫瑰褐 */
  --west: rgba(84, 100, 146, 0.42);          /* 西玄板块的底色：灰蓝 */
  --glass: rgba(255, 255, 255, 0.13);        /* 半透明的"玻璃"小块 */
  --glass-dark: #35283F;                     /* 首页顶部导航的底色：实色，不透明 */
  --glass-line: rgba(255, 255, 255, 0.28);   /* 玻璃的边线 */
  --fade: rgba(42, 30, 60, 0.75);            /* 板块底部的渐隐 */
  --gold: #EED9A6;                           /* 首页的点缀色：香槟金 */
  --on-image-soft: rgba(255, 255, 255, 0.80);/* 图片上的次要文字 */

  --font-display: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC", "SimSun", serif;   /* 标题字体：用设备自带的宋体 */
  --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;   /* 正文字体：用设备自带的黑体 */

  --radius: 6px;          /* 圆角大小 */
  --page-width: 880px;    /* 内容最大宽度 */
  --shadow: rgba(30, 20, 45, 0.45); /* 板块浮起来时的阴影 */
  color-scheme: light;
}
/* 配色思路：巴洛克油画的感觉。米色、香槟、珍珠白打底，古金描边，一点粉色。首页是星云图。 */

/* ---------- 以下是各个部件的样式，一般不用动 ---------- */
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
.wrap { max-width: var(--page-width); margin: 0 auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 顶部导航 */
.topbar { border-bottom: 1px solid var(--line); background: var(--surface); }
/* 顶部导航比正文更宽，所以网站名和登录按钮更靠两边。max-width 越大越靠边 */
.topbar .wrap { max-width: 1440px; padding-inline: clamp(20px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--ink); text-decoration: none; }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: .75rem; color: var(--muted); margin-left: 6px; }
.roles { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.roles button { font: inherit; font-size: .875rem; padding: 6px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.roles button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* 内容区 */
main.wrap { padding-block: 28px 64px; display: flex; flex-direction: column; gap: 24px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: .875rem; color: var(--muted); }
.crumbs a { color: var(--muted); }
.pagetype { align-self: flex-start; font-size: .75rem; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 99px; }
.lead { color: var(--muted); max-width: 34em; }
.head { display: flex; flex-direction: column; gap: 10px; }

/* 首页：星云背景。图片文件是 bg.jpg，要和 index.html 放在同一个文件夹 */
body.is-home {
  min-height: 100vh;
  background-color: var(--night);
  background-image: linear-gradient(var(--scrim-top), var(--scrim-bottom)), url("bg.jpg");
  background-size: cover; background-position: center; background-attachment: fixed;
}
body.is-home main { color: var(--on-image); }
body.is-home .lead, body.is-home .note { color: var(--on-image-soft); }
body.is-home .note { border-color: var(--glass-line); }
body.is-home .hello { color: var(--gold); }
body.is-home .topbar { background: var(--glass-dark); border-color: var(--glass-line); }
body.is-home .brand, body.is-home .nav a { color: var(--on-image); }
body.is-home .brand small { color: var(--on-image-soft); }
body.is-home .nav a.btn { background: var(--gold); color: var(--night); }
body.is-home .roles { border-color: var(--glass-line); }
body.is-home .roles button { color: var(--on-image-soft); }
body.is-home .roles button[aria-pressed="true"] { background: var(--on-image); color: var(--night); }

/* 首页顶部的三行字：居中，往下放，行距拉开 */
body.is-home .head { align-items: center; text-align: center; gap: 18px; margin-top: clamp(16px, 5vh, 48px); margin-bottom: clamp(16px, 4vh, 36px); }
body.is-home .head .pagetype { align-self: center; }
body.is-home h1 { font-size: clamp(1.6rem, 4.2vw, 2.3rem); line-height: 1.4; }   /* 首页大标题的字号，最后一个数字是电脑上的大小 */
body.is-home .lead { font-size: 1.05rem; line-height: 1.9; }
body.is-home h1, body.is-home .lead, body.is-home .hello { text-shadow: 0 1px 14px var(--shadow); }   /* 文字后面一点阴影，在亮的地方也看得清 */
body.is-home .note { margin-top: clamp(24px, 6vh, 56px); text-align: center; }

/* 首页：东玄、西玄两个大板块，左右并排 */
.realms { display: flex; justify-content: center; gap: clamp(20px, 6vw, 72px); }   /* gap 是两个板块之间的距离 */
/* flex 里的 250px 是板块的宽度；aspect-ratio 是宽和高的比例，后面的数字越大板块越高 */
.realm { position: relative; overflow: hidden; flex: 0 1 320px; min-width: 0; aspect-ratio: 3 / 3.6; display: flex; flex-direction: column; padding: clamp(14px, 3vw, 26px) clamp(12px, 2.6vw, 24px) 0; border: 1px solid var(--glass-line); border-radius: 22px; color: var(--on-image); text-decoration: none; backdrop-filter: blur(6px); transition: transform .25s ease, box-shadow .25s ease; }
.realm.east { background: var(--east); }
.realm.west { background: var(--west); }
/* 鼠标移上去：淡金色粗边框，板块略微放大并浮起 */
.realm:hover, .realm:focus-visible { transform: translateY(-6px) scale(1.04); box-shadow: 0 0 0 3px var(--gold), 0 22px 44px var(--shadow); outline: none; }
@media (prefers-reduced-motion: reduce) { .realm { transition: none; } .realm:hover, .realm:focus-visible { transform: none; } }
.realm h2 { font-size: clamp(1.3rem, 4.5vw, 1.9rem); letter-spacing: .14em; }
.realm .sub { font-size: clamp(.75rem, 2.4vw, .8125rem); color: var(--on-image-soft); }
/* 板块里的"文件夹"：四个半透明小块。margin-bottom 是负数，所以下面一排被板块挡住一半 */
.folder { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 2vw, 10px); padding: clamp(8px, 2vw, 12px); margin-top: auto; margin-bottom: -24%; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; }
.tile { aspect-ratio: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line); }
.tile b { font-family: var(--font-display); font-size: clamp(1.1rem, 4.5vw, 2rem); line-height: 1; }
.tile span { font-size: clamp(.625rem, 2.1vw, .875rem); color: var(--on-image-soft); }
.realm::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18%; background: linear-gradient(to bottom, transparent, var(--fade)); pointer-events: none; }

/* 东玄、西玄页面：每个门类一条长条，各有自己的底色 */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid transparent; border-radius: 14px; color: var(--on-image); text-decoration: none; }
.bar:hover { border-color: var(--gold); }
.bar > div { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.bar p { font-size: .9375rem; color: var(--on-image-soft); }
.bar .glyph { border-color: var(--glass-line); color: var(--on-image); background: var(--glass); }
.bar .count { flex: none; font-size: .8125rem; color: var(--on-image-soft); }

/* 领域页顶部的横幅插画 */
.banner { position: relative; height: 150px; overflow: hidden; border-radius: 14px; background: var(--image-base); }
.banner .art { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; }

.row:hover { border-color: var(--accent); }
.glyph { flex: none; font-family: var(--font-display); font-size: 1.6rem; width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid var(--accent); color: var(--accent); border-radius: 50%; }

/* 列表行（引路人列表、业务列表） */
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 14px; align-items: flex-start; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.row > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row p { color: var(--muted); font-size: .9375rem; }
.avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-size: 1.2rem; }
.avatar.big { width: 76px; height: 76px; font-size: 1.9rem; }

/* 业务页顶部的引路人入口 */
.who { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); align-self: flex-start; }
.who div span { font-size: .875rem; color: var(--muted); display: block; }

/* 引路人主页头部 */
.profile { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.profile > div { min-width: 0; flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px; }

.block { display: flex; flex-direction: column; gap: 10px; }
.block ul { margin: 0; padding-left: 1.2em; }
.btn { align-self: flex-start; font: inherit; padding: 10px 22px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); cursor: pointer; }
.note { font-size: .875rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.empty { padding: 28px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }

/* 右上角：登录、注册、我的 */
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.nav a { color: var(--ink); font-size: .9375rem; }
a.btn { text-decoration: none; }
.nav a.btn { color: var(--on-accent); }
.btn.small { padding: 6px 14px; font-size: .875rem; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.hello { color: var(--accent); }
.hint { font-size: .875rem; color: var(--muted); }

/* 表单：登录、注册、引路人申请 */
.form { display: flex; flex-direction: column; gap: 14px; max-width: 400px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: .875rem; color: var(--muted); }
.form input, .form textarea { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
.form label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 1rem; }
.form select { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); }
.form input[type="file"] { padding: 8px; }
.form fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.form .question { color: var(--ink); font-weight: 500; }
.error { color: var(--danger); font-size: .9375rem; }
[hidden] { display: none !important; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 18px; }

/* 个人页面里的一块内容 */
.panel { display: flex; flex-direction: column; gap: 12px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.badge { align-self: flex-start; font-size: .8125rem; padding: 2px 10px; border-radius: 99px; background: var(--accent); color: var(--on-accent); }

/* ---------- 巴洛克风格的细节 ---------- */
/* 页面背景：米色上有一角珍珠光、一角淡粉 */
body { margin: 0; background: radial-gradient(120% 80% at 12% 0%, var(--pearl), transparent 60%), radial-gradient(90% 70% at 100% 100%, var(--blush-wash), transparent 55%), var(--bg); background-attachment: fixed; }
h1 { letter-spacing: .04em; }
.topbar { border-bottom-color: var(--gilt-soft); }
/* 标题下面一道描金双线 */
.head::after { content: ""; width: 64px; height: 4px; border-block: 1px solid var(--gilt); }
/* 卡片：像画框一样，里面多一圈描金细线 */
.row, .panel { box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--gilt-soft); }
.avatar { background: var(--blush); color: var(--blush-ink); }
/* 长条和首页板块：内圈描金 */
.bar { position: relative; }
.bar::before, .realm::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--gilt-on-dark); pointer-events: none; }
.bar::before { border-radius: 9px; }
.realm::before { border-radius: 17px; }

/* ---------- 登录页和注册页 ---------- */
/* 背景：同一张星云图，虚化、调亮，再盖一层暖光。blur 后面的数字越大越模糊，brightness 越大越亮 */
body.is-auth { background: var(--night); min-height: 100vh; }
body.is-auth::before, body.is-sheet::before { content: ""; position: fixed; inset: -60px; z-index: -1; background: linear-gradient(var(--veil), var(--veil)), url("bg.jpg") center / cover; filter: blur(22px) brightness(1.02) saturate(.85); }
body.is-auth .topbar { background: var(--bar-glass); }
/* 卡片：居中，暖色底，像弹窗一样浮起来 */
.auth-card { width: min(100%, 430px); margin: clamp(16px, 6vh, 64px) auto; padding: clamp(24px, 6vw, 40px) clamp(20px, 5vw, 36px); display: flex; flex-direction: column; gap: 22px; text-align: center; background: var(--card-warm); border-radius: 20px; box-shadow: 0 30px 70px var(--shadow), inset 0 0 0 6px var(--card-warm), inset 0 0 0 7px var(--gilt-soft); }
.auth-card .head { align-items: center; gap: 12px; }
.auth-card .lead { max-width: none; }
.auth-card .form { max-width: none; text-align: left; }
.auth-card .form .btn { align-self: stretch; margin-top: 4px; }
.auth-card .panel { padding: 18px 0 0; gap: 10px; background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; }
.auth-card .actions { justify-content: center; }

/* ---------- 东玄页、西玄页的背景色 ---------- */
body.tone-east { background: var(--east-page); --muted: var(--tone-muted); --line: var(--tone-line); --gilt: var(--gilt-deep); }
body.tone-west { background: var(--west-page); --muted: var(--tone-muted); --line: var(--tone-line); --gilt: var(--gilt-deep); }

/* ---------- 长条：油画颜料的底色，加一点光泽 ---------- */
.bar { background: var(--c, var(--ink)); }   /* 整条一个颜色，不做深浅变化 */

/* ---------- 引路人申请页：比登录卡片宽一些 ---------- */
.auth-card.wide { width: min(100%, 560px); }
.auth-card .checks { justify-content: center; }
.auth-card .form .block { align-items: center; }
.auth-card fieldset .block { align-items: stretch; text-align: left; }
.auth-card fieldset .checks { justify-content: flex-start; }

/* ---------- "我的"页面：内容在页面中间的一栏里，文字仍然靠左。max-width 是这一栏的宽度 ---------- */
.narrow { width: 100%; max-width: 620px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }

/* ---------- 星云背景上的空状态框（引路人界面） ---------- */
body.is-home .empty { color: var(--on-image-soft); border-color: var(--glass-line); background: var(--glass); text-align: center; }

/* ---------- 标志和英文名 ---------- */
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-latin); font-weight: 500; font-size: 1.05rem; letter-spacing: .3em; }
.logo { flex: none; width: 32px; height: 32px; }
.logo .star { fill: var(--gilt); }
body.is-home .logo .star { fill: var(--gold); }

/* ---------- 中间一栏的页面："我的"、成为引路人、用户协议、隐私政策 ---------- */
/* 两边透出虚化的星云图，中间是一整栏暖色。max-width 是这一栏的宽度 */
body.is-sheet { background: var(--night); min-height: 100vh; }
body.is-sheet .topbar, body.is-sheet .foot, body.is-auth .foot { background: var(--bar-glass); }
body.is-sheet main { max-width: 780px; min-height: calc(100vh - 130px); padding-inline: clamp(20px, 6vw, 64px); background: var(--card-warm); box-shadow: 0 0 60px var(--shadow); }
body.is-sheet .auth-card { margin: 0 auto; padding: 0; background: none; box-shadow: none; }

/* ---------- 协议和隐私政策的正文 ---------- */
.legal .block p { color: var(--ink); }
.form label.agree { align-items: flex-start; font-size: .875rem; line-height: 1.6; color: var(--muted); }
.form label.agree input { margin-top: 4px; padding: 0; }

/* ---------- 页脚 ---------- */
.foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; padding: 18px 20px; font-size: .8125rem; color: var(--muted); border-top: 1px solid var(--line); }
.foot a { color: var(--muted); }
body.is-home .foot { background: var(--glass-dark); border-color: var(--glass-line); color: var(--on-image-soft); }
body.is-home .foot a { color: var(--on-image-soft); }

/* ---------- 标志的颜色。标志只有一份图形，颜色由两个值决定：字的颜色和蛇的颜色。重叠处是镂空的，会露出背景 ---------- */
.lg-ink { fill: var(--lg-ink); }
.lg-snake { fill: var(--lg-snake); }
.lg-line { fill: none; stroke: var(--lg-snake); }
.topbar { --lg-ink: var(--ink); --lg-snake: #B8923F; }             /* 浅色页面：深褐的字，金蛇 */
body.is-home .topbar { --lg-ink: #F3E9D2; --lg-snake: #E6CF95; } /* 深色页面：象牙白的字，浅金蛇 */

/* ---------- 顶部导航里的标志。height 是标志的高度 ---------- */
.topbar .wrap { padding-block: 10px; }
.nav-logo { display: block; height: 56px; aspect-ratio: 529 / 346; }
.brand-home { display: none; font-family: var(--font-body); font-size: .9375rem; letter-spacing: 0; font-weight: 400; }   /* 和右边的登录用同一种字 */
body.at-home .nav-logo { display: none; }                 /* 首页：左上角不放标志，改成"首页"两个字 */
body.at-home .brand-home { display: block; }
body.at-home .topbar .wrap { padding-block: 12px; }

/* ---------- 首页中间的大标志和标题 ---------- */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; margin-top: clamp(12px, 3vh, 36px); }
.hero-logo { width: min(64%, 240px); aspect-ratio: 529 / 346; --lg-ink: #F3E9D2; --lg-snake: #E6CF95; }   /* width 里的 520px 是标志的最大宽度 */
.hero h1 { font-size: clamp(1.55rem, 3.4vw, 2.1rem); line-height: 1.5; letter-spacing: .08em; margin-top: 6px; }
.hero .lead { font-size: 1.0625rem; line-height: 1.9; max-width: none; }
.hero h1, .hero .lead, .hero .hello { text-shadow: 0 1px 14px var(--shadow); }
.hero::after { content: ""; width: 72px; height: 4px; border-block: 1px solid var(--gilt); }

/* ---------- 首页搜索栏 ---------- */
.search { position: relative; width: min(100%, 560px); margin: clamp(8px, 2vh, 20px) auto 0; }
.search input { width: 100%; font: inherit; font-size: 1rem; padding: 14px 24px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--on-image); backdrop-filter: blur(8px); }
.search input::placeholder { color: var(--on-image-soft); }
.search input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 10px); display: flex; flex-direction: column; padding: 8px; background: var(--card-warm); color: var(--ink); border-radius: 16px; box-shadow: 0 24px 60px var(--shadow); text-align: left; }
.results a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; }
.results a:hover, .results a:focus-visible { background: var(--accent-soft); }
.results .tag { flex: none; font-size: .75rem; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.results strong { display: block; font-family: var(--font-display); }
.results small { display: block; font-size: .8125rem; color: var(--muted); }
.results p { padding: 12px; color: var(--muted); }

/* ---------- 首页各部分之间的距离 ---------- */
body.at-home .realms { margin-top: clamp(28px, 6vh, 56px); }
body.at-home .note { margin-top: clamp(40px, 8vh, 80px); line-height: 2; }

/* ---------- 给新人的推荐入口 ---------- */
.guide { width: min(100%, 680px); margin: clamp(40px, 8vh, 80px) auto 0; padding: clamp(24px, 5vw, 44px); display: flex; flex-direction: column; gap: 18px; text-align: center; color: var(--on-image); background: var(--fade); border: 1px solid var(--glass-line); border-radius: 22px; backdrop-filter: blur(8px); }
.guide h2 { font-size: clamp(1.3rem, 3vw, 1.6rem); letter-spacing: .06em; }
.guide > p { color: var(--on-image-soft); line-height: 1.9; }
.guide form { display: flex; flex-direction: column; gap: 14px; }
.guide textarea { font: inherit; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--on-image); resize: vertical; }
.guide textarea::placeholder { color: var(--on-image-soft); }
.guide .btn { align-self: center; background: var(--gold); color: var(--night); padding: 12px 34px; }
.guide .hint { color: var(--on-image-soft); }
.guide #guide-result { display: flex; flex-direction: column; gap: 14px; text-align: left; margin-top: 6px; }
.guide-lead { color: var(--on-image); }
.guide .bar h2 { font-size: 1.15rem; letter-spacing: 0; }
.guide-care { padding: 18px 20px; border-radius: 14px; background: var(--card-warm); color: var(--ink); display: flex; flex-direction: column; gap: 8px; }

/* ---------- 协议、隐私政策和各处的小字声明：字号比正文小一档 ---------- */
.legal { font-size: .875rem; line-height: 1.85; }
.legal h1 { font-size: 1.5rem; }
.legal h2 { font-size: 1rem; }
.legal .lead { font-size: .8125rem; }
.legal .block { gap: 6px; }
.hint, .form label.agree { font-size: .8125rem; line-height: 1.7; }

/* ---------- 首页最下方的那句祝愿 ---------- */
.closing { margin-top: clamp(56px, 12vh, 120px); text-align: center; font-family: var(--font-display); font-size: clamp(1.3rem, 3vw, 1.7rem); letter-spacing: .14em; color: var(--on-image); text-shadow: 0 1px 14px var(--shadow); }
.closing::before { content: ""; display: block; width: 72px; height: 4px; margin: 0 auto 28px; border-block: 1px solid var(--gilt); }

/* ---------- "成为引路人"介绍页 ---------- */
.become { gap: 30px; padding-block: 12px 40px; }
.become ul { line-height: 2; }
.become .btn { padding: 12px 30px; }

/* ---------- 登录页的验证码一行、文字样式的按钮 ---------- */
.code-row { display: flex; gap: 10px; align-items: flex-end; }
.code-row label { flex: 1; min-width: 0; }
.code-row .btn { flex: none; padding: 10px 14px; font-size: .875rem; align-self: flex-end; margin: 0; }
.linklike { align-self: center; font: inherit; font-size: .875rem; background: none; border: 0; padding: 4px; color: var(--accent); text-decoration: underline; cursor: pointer; }
.account-part { padding-bottom: 22px; margin-bottom: 6px; border-bottom: 1px solid var(--line); gap: 14px; }
.auth-card .form .account-part { align-items: stretch; text-align: left; }
.become h2 { font-size: 1.25rem; }

/* ---------- 返回链接 ---------- */
.back { align-self: flex-start; font-size: .9375rem; color: var(--muted); text-decoration: none; padding-top: 14px; }
.back:hover { color: var(--accent); }

/* ---------- 引路人工作台 ---------- */
.desk { width: 100%; max-width: 760px; margin: clamp(12px, 3vh, 32px) auto 0; display: flex; flex-direction: column; gap: 20px; }
.desk-head h1 { color: var(--on-image); font-size: 1.7rem; text-shadow: 0 1px 14px var(--shadow); }
.desk-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.desk-tabs a { display: flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--on-image); text-decoration: none; font-size: .9375rem; backdrop-filter: blur(8px); }
.desk-tabs a[aria-current="page"] { background: var(--gold); border-color: var(--gold); color: var(--night); }
.desk-tabs i { font-style: normal; font-size: .75rem; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 99px; background: var(--danger); color: var(--on-accent); }
.desk-panel { display: flex; flex-direction: column; gap: 14px; padding: clamp(20px, 4vw, 32px); background: var(--card-warm); color: var(--ink); border-radius: 18px; box-shadow: 0 20px 50px var(--shadow); }
.desk-panel h2 { font-size: 1.2rem; }
.desk-panel h3 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stats div { display: flex; flex-direction: column; gap: 2px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.stats b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stats span { font-size: .8125rem; color: var(--muted); }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checklist li { display: flex; gap: 10px; align-items: center; }
.checklist li span { width: 22px; text-align: center; color: var(--muted); }
.checklist li.ok { color: var(--muted); }
.checklist li.ok span { color: var(--accent); }
.form.wide { max-width: none; }
.svc { display: flex; flex-direction: column; gap: 10px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.svc-head { display: flex; align-items: center; gap: 12px; }
.svc-head .glyph { width: 40px; height: 40px; font-size: 1.25rem; background: var(--c); border-color: var(--c); color: var(--on-image); }
.svc-head .pill { margin-left: auto; }
.svc ul { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: .9375rem; }
.pill { font-size: .75rem; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.on { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.req { display: flex; gap: 14px; align-items: flex-start; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.req.fresh { border-color: var(--accent); }
.req > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.req small { font-size: .8125rem; color: var(--muted); }
.req .btn { flex: none; }

/* 正在编辑的那张业务卡片 */
.svc.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); gap: 14px; }

/* ============ 引路人主页的背景横幅和头像 ============ */
/* 横幅：头像后面那一长条背景。高度改这里 */
.cover { height: clamp(120px, 22vw, 190px); border-radius: var(--radius); background-size: cover; background-position: center; position: relative; box-shadow: inset 0 0 0 1px var(--gilt-soft); }
/* 头像压在横幅下沿上 */
.profile.over { --ring: var(--bg); margin-top: -48px; padding-inline: clamp(14px, 3vw, 26px); align-items: flex-start; position: relative; }
.profile.over .avatar.big { width: 96px; height: 96px; border: 4px solid var(--ring); box-sizing: border-box; }
.profile.over > div { padding-top: 58px; }
.desk-panel .profile.over { --ring: var(--card-warm); }
body.tone-east .profile.over, body.tone-west .profile.over { --ring: var(--surface); }
@media (max-width: 520px) { .profile.over { flex-direction: column; gap: 8px; } .profile.over > div { padding-top: 0; flex: none; } }
/* 头像里的图案和照片 */
.avatar { overflow: hidden; background-size: cover; background-position: center; }
.avatar svg { width: 62%; height: 62%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* 工作台里：横幅右上角的按钮、可以点的头像 */
.cover-tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.chip-btn { font: inherit; font-size: .8125rem; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55); background: rgba(30,22,30,.55); color: #fff; cursor: pointer; }
.chip-btn:hover { background: rgba(30,22,30,.8); }
.chip-btn.plain { border-color: var(--line); background: transparent; color: var(--accent); align-self: flex-start; }
.chip-btn.plain:hover { background: var(--accent-soft); }
.avatar-edit { position: relative; flex: none; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
.avatar-edit i { position: absolute; right: 0; bottom: 2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-style: normal; font-size: .8rem; border: 2px solid var(--ring); }
.avatar-edit:hover .avatar { filter: brightness(.9); }

/* ============ 引路人主页、业务页：一块一块的卡片 ============ */
/* 主页头部：横幅、头像、名字装在同一张卡片里 */
.phead { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; padding-bottom: 22px; box-shadow: 0 8px 22px rgba(70, 45, 30, .12); }
.phead .cover { border-radius: 0; box-shadow: none; }
.phead .profile.over { --ring: var(--surface) !important; }
/* 每一段内容一张卡片。标题下面一道细线 */
.block.card { padding: 20px clamp(18px, 3vw, 28px) 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 22px rgba(70, 45, 30, .12); gap: 14px; }
.block.card > h2 { padding-bottom: 10px; border-bottom: 1px solid var(--gilt-soft); }
/* 卡片里面的小条目：用浅一点的底色，和卡片分开 */
.block.card .row { background: var(--bg); box-shadow: none; }

/* ============ 业务页头部：头像在左，标题在右。点头像进引路人主页 ============ */
.shead { display: flex; gap: clamp(14px, 3vw, 24px); align-items: center; padding: clamp(18px, 3vw, 28px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 22px rgba(70, 45, 30, .12); }
.shead > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.avatar-link { flex: none; border-radius: 50%; transition: box-shadow .15s, transform .15s; }
.avatar-link:hover, .avatar-link:focus-visible { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--gilt); transform: scale(1.04); }
.avatar-link .avatar { display: grid; }
/* 顶部路径：字稍大一点，好点 */
.crumbs { font-size: .9375rem; }

/* ============ 中英文切换按钮（左上角，首页二字旁边） ============ */
.lang-btn { margin-left: 14px; margin-right: auto; font: inherit; font-size: .8125rem; line-height: 1; padding: 6px 11px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: var(--muted); cursor: pointer; opacity: .85; }
.lang-btn:hover { opacity: 1; color: var(--accent); }
body.is-home .lang-btn, body.is-desk .lang-btn { color: var(--on-image); }
/* 英文版：标题不用中文的字距，长单词可以换行 */
html[lang="en"] h1, html[lang="en"] h2 { letter-spacing: 0; overflow-wrap: anywhere; }
/* 英文版首页：大标题小一点，保持一行；页尾那句字距收一点 */
html[lang="en"] .hero h1 { font-size: clamp(1.4rem, 3vw, 1.95rem); letter-spacing: 0; }
@media (min-width: 760px) { html[lang="en"] .hero h1 { white-space: nowrap; } }
html[lang="en"] .closing { letter-spacing: .12em; }

/* 求助提示里的热线清单 */
.guide-care ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.guide-care a { color: var(--accent); font-weight: 600; }
.guide-care .hint { color: var(--ink); opacity: .7; }

// 画头像。who 里要有 name 和 avatar。avatar 可以是预设名、图片文件名，或上传后的图片
function avatarHtml(who, extra = "") {
  const a = who.avatar || "", preset = AVATARS[a];
  if (preset) return `<span class="avatar ${extra}" style="background:${preset.bg};color:${preset.ink}"><svg viewBox="0 0 48 48" aria-hidden="true">${preset.art}</svg></span>`;
  if (a) return `<span class="avatar ${extra}" style="background-image:url('${a}')"></span>`;
  return `<span class="avatar ${extra}">${esc((who.name || "?")[0])}</span>`;
}
// 横幅背景的写法。预设名用渐变，其他当作图片
function coverCss(cover) { return COVERS[cover] ? `background:${COVERS[cover]}` : `background-image:url('${cover}')`; }
const pick = obj => { const k = Object.keys(obj); return k[Math.floor(Math.random() * k.length)]; };

// 每一行：左边是句子的样子，右边是怎么拼出英文。
const EN_RULES = [
  [/^(\d+) 个门类$/, m => m[1] + (m[1] === "1" ? " practice" : " practices")],
  [/^(\d+) 位引路人$/, m => m[1] + (m[1] === "1" ? " guide" : " guides")],
  [/^查看(.+)的主页$/, m => "View " + tr(m[1]) + "'s profile"],
  [/^欢迎回来，(.+)$/, m => "Welcome back, " + tr(m[1])],
  [/^(.+)，欢迎回来$/, m => "Welcome back, " + tr(m[1])],
  [/^主页完成度\s*(\d+) \/ (\d+)$/, m => "Profile completeness  " + m[1] + " / " + m[2]],
  [/^(.+)（已添加）$/, m => tr(m[1]) + " (added)"],
  [/^编辑：(.+)$/, m => "Edit: " + tr(m[1])],
  [/^(.+) · (.+)$/, m => tr(m[1]) + " · " + tr(m[2])],
  [/^看起来是(.+)。可以先看看这几个方向：$/, m => "This sounds like it is about " + m[1].split("，以及").map(tr).join(", and ") + ". You could start with these:"],
  [/^(.+)的(.+)$/, m => EN[m[1]] && EN[m[2]] ? EN[m[1]] + "'s " + EN[m[2]] : null],   // 例如：林见月的占星
];

// 门类圆圈里的那个字：英文版自动用英文名的第一个字母。例如 Tarot 用 T
DOMAINS.forEach(d => { if (EN[d.name] && EN[d.glyph] == null) EN[d.glyph] = EN[d.name][0]; });

// ---- 下面是切换语言的机关，一般不用改 ----
let lang = "zh";
try { if (localStorage.getItem("universe-lang") === "en") lang = "en"; } catch (e) {}   // 记住上次选的语言
// 把一句中文换成英文。找不到就原样返回
function tr(text) {
  if (EN[text] != null) return EN[text];
  for (const [shape, build] of EN_RULES) { const m = text.match(shape); if (m) { const r = build(m); if (r != null) return r; } }
  return text;
}
const HAS_ZH = /[\u3400-\u9fff]/, LANG_ATTRS = ["placeholder", "title", "aria-label", "alt"], zhOf = new WeakMap();
// 把页面上某一块里的中文全部换成英文，并记住原来的中文，方便切回去
function translateIn(root) {
  if (lang !== "en" || !root) return;
  const texts = [];
  if (root.nodeType === 3) texts.push(root);
  else if (root.nodeType === 1) { const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) texts.push(n); }
  else return;
  texts.forEach(n => {
    const p = n.parentElement; if (!p || p.closest("script,style,textarea,[data-keep]")) return;
    const raw = n.nodeValue, t = raw.trim(); if (!t || !HAS_ZH.test(t)) return;
    const en = tr(t); if (en === t) return;
    const out = raw.replace(t, () => en); zhOf.set(n, { zh: raw, en: out }); n.nodeValue = out;
  });
  if (root.nodeType !== 1) return;
  [root, ...root.querySelectorAll("*")].forEach(el => {
    if (el.closest("[data-keep]")) return;
    LANG_ATTRS.forEach(a => { const v = el.getAttribute(a); if (v && HAS_ZH.test(v)) { const en = tr(v); if (en !== v) { el.setAttribute("data-zh-" + a, v); el.setAttribute(a, en); } } });
    // 输入框里预先填好的示例文字（用户自己打的字不动）
    const isText = el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && (el.type === "text" || !el.type));
    if (isText && el.value === el.defaultValue && HAS_ZH.test(el.value)) { el._zh = el.value; el.value = el._en = el.value.split("\n").map(tr).join("\n"); }
  });
}
// 切回中文：把记住的原文放回去
function restoreZh() {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) { const rec = zhOf.get(n); if (rec && n.nodeValue === rec.en) n.nodeValue = rec.zh; }
  document.querySelectorAll("*").forEach(el => {
    LANG_ATTRS.forEach(a => { const v = el.getAttribute("data-zh-" + a); if (v != null) { el.setAttribute(a, v); el.removeAttribute("data-zh-" + a); } });
    if (el._zh != null && el.value === el._en) el.value = el._zh;
    delete el._zh; delete el._en;
  });
}
function setLang(next) {
  lang = next === "en" ? "en" : "zh";
  try { localStorage.setItem("universe-lang", lang); } catch (e) {}
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
  document.getElementById("lang-btn").textContent = lang === "en" ? "中文" : "EN";
  if (lang === "en") translateIn(document.body); else restoreZh();
}
// 页面内容一有变化（换页、弹出提示、按钮变字），马上把新出现的中文换成英文
new MutationObserver(list => {
  if (lang !== "en") return;
  list.forEach(m => { if (m.type === "characterData") translateIn(m.target); else m.addedNodes.forEach(translateIn); });
}).observe(document.body, { childList: true, subtree: true, characterData: true });
document.getElementById("lang-btn").addEventListener("click", () => setLang(lang === "en" ? "zh" : "en"));

function searchAll(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const hit = t => t.toLowerCase().includes(q) || (lang === "en" && tr(t).toLowerCase().includes(q));   // 英文版里也能用英文搜

}

// 以后接入后台时，这一段会换成真正的匹配。
const GUIDE_RULES = [
  { words: ["感情", "love", "relationship", "breakup", "break up", "broke up", "marriage", "partner", "boyfriend", "girlfriend", "dating", "crush", "husband", "wife", "恋爱", "分手", "婚姻", "喜欢", "对象", "复合", "暧昧", "暗恋", "伴侣"], domains: ["tarot", "astrology", "lenormand"], why: "和感情、关系有关的问题" },

  { words: ["焦虑", "anxious", "anxiety", "insomnia", "stress", "tired", "exhausted", "nervous", "sleep", "emotion", "overwhelm", "burnout", "失眠", "压力", "累", "疲惫", "紧张", "烦", "静不下", "睡不着", "情绪"], domains: ["meditation", "healing"], why: "和情绪、身心状态有关的问题" },
  { words: ["自己", "myself", "personality", "direction", "lost", "talent", "future", "destiny", "purpose", "who i am", "性格", "方向", "迷茫", "人生", "天赋", "适合", "未来", "命运"], domains: ["bazi", "astrology", "ziwei"], why: "想更了解自己、看清方向" },
  { words: ["搬家", "move", "moving", "house", "home", "office", "feng shui", "layout", "renovat", "apartment", "房子", "家里", "办公室", "风水", "布局", "装修"], domains: ["fengshui"], why: "和居住、空间有关的问题" },
  { words: ["学习", "learn", "beginner", "course", "study", "class", "curious", "入门", "想学", "课程", "了解一下"], domains: ["tarot", "astrology", "meditation"], why: "想入门学习" },
];
// 出现这些词时不做推荐，改为提示求助渠道
const CRISIS_WORDS = ["suicide", "suicidal", "kill myself", "want to die", "end my life", "self-harm", "self harm", "hurt myself", "harm myself", "don't want to live", "dont want to live", "no reason to live", "自杀", "不想活", "想死", "伤害自己", "自残", "结束生命", "活不下去", "轻生"];

function guideMatch(text) {
  text = text.toLowerCase();
  if (CRISIS_WORDS.some(w => text.includes(w))) return { crisis: true };
  const hits = GUIDE_RULES.filter(rule => rule.words.some(w => text.includes(w)));
  const picked = [], reasons = hits.map(r => r.why);
  for (let k = 0; k < 3; k++) hits.forEach(r => { const id = r.domains[k]; if (id && !picked.includes(id)) picked.push(id); });   // 每条规则轮流取一个，保证每种情况都有推荐
  if (!picked.length) return { domains: ["tarot", "meditation", "astrology"], reasons: [] };
  return { domains: picked.slice(0, 3), reasons };
}
function guideHtml(res) {

}

/* ============================================================
   第四区：页面跳转（不用动）
   每个页面有一个固定地址。同一个地址永远打开同一个页面。
   home / d-领域 / s-引路人-领域 / m-引路人 / teacher
   ============================================================ */
const app = document.getElementById("app");
let current = "";

// 当前用户。原型里只存在内存中，刷新页面就会重置。
// mentorStatus：none = 普通问路人，pending = 已申请待审核，approved = 已认证引路人
const user = { loggedIn: false, name: "", mentorStatus: "none", favorites: [] };
let afterLogin = "";   // 登录后要回到哪个页面

// 把用户输入的文字变成安全的显示内容
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// 右上角的内容，随登录状态变化
function renderNav() {
  const nav = document.getElementById("nav");
  if (!user.loggedIn) {
    nav.innerHTML = `<a href="#become" data-go="become">成为引路人</a><a href="#login" data-go="login">登录</a><a class="btn small" href="#register" data-go="register">注册</a>`;
    return;
  }
  // "成为引路人"只给还没申请过的人看
  const become = user.mentorStatus === "none" ? `<a href="#become" data-go="become">成为引路人</a>` : "";
  const inTeacher = isGuidePage(current);
  const roles = user.mentorStatus === "approved" ? `
    <div class="roles" role="group" aria-label="切换身份">
      <button type="button" data-role="seeker" aria-pressed="${!inTeacher}">问路</button>
      <button type="button" data-role="mentor" aria-pressed="${inTeacher}">引路</button>
    </div>` : "";
  nav.innerHTML = become + roles + `<a href="#me" data-go="me">我的</a>`;
}

function render(token) {
  const before = current;
  let [kind, a, b] = token.split("-");
  // 这三个页面要先登录
  if (["me", "teacher", "t"].includes(kind) && !user.loggedIn) { afterLogin = token; token = kind = "login"; }   // 申请页不用先登录，可以边注册边申请
  // 已登录的人不用再看登录和注册
  if (["login", "register"].includes(kind) && user.loggedIn) token = kind = "me";
  // 引路人工作台只给已认证的引路人
  if (["teacher", "t"].includes(kind) && user.mentorStatus !== "approved") token = kind = "me";
  // 已经申请过的人不用再填申请
  if (kind === "apply" && user.mentorStatus !== "none") token = kind = "me";

  let html = null;
  if (kind === "g" && find(GROUPS, a)) html = pageGroup(a);
  else if (kind === "d" && find(DOMAINS, a)) html = pageDomain(a);
  else if (kind === "s" && SERVICES.some(s => s.mentor === a && s.domain === b)) html = pageService(a, b);
  else if (kind === "m" && find(MENTORS, a)) html = pageMentor(a);
  else if (kind === "login") html = pageLogin();
  else if (kind === "register") html = pageRegister();
  else if (kind === "me") html = pageMe();
  else if (kind === "apply") html = pageApply();
  else if (LEGAL[kind]) html = pageLegal(kind);
  else if (kind === "become") html = pageBecome();
  else if (DESK_TABS.some(t => t[0] === token)) html = pageTeacher(token);
  if (html === null) { token = "home"; html = pageHome(); }
  current = token;
  document.body.classList.toggle("is-home", token === "home" || token === "teacher" || token.startsWith("t-"));   // 首页和引路人界面用星云背景
  // 东玄页、西玄页，以及它们下面的门类页，用各自方向的底色
  const [k2, a2] = token.split("-");
  const tone = k2 === "g" ? a2 : k2 === "d" ? find(DOMAINS, a2).group : "";
  document.body.classList.toggle("tone-east", tone === "east");
  document.body.classList.toggle("tone-west", tone === "west");
  document.body.classList.toggle("at-home", token === "home");   // 首页：左上角显示"首页"两个字，标志放到页面中间
  document.body.classList.toggle("is-sheet", ["me", "apply", "terms", "privacy", "become"].includes(token));   // 中间一栏，两边是虚化的星云
  document.body.classList.toggle("is-auth", token === "login" || token === "register");   // 登录、注册页用虚化的星云背景
  app.innerHTML = html;
  renderNav();
  if (current !== before) window.scrollTo(0, 0);   // 同一页重新显示时，不跳回顶部
}

// 走过的页面。用来做"返回"，以及在问路和引路之间切换时回到原来的位置
const trail = [];
const lastPlace = { seeker: "home", guide: "teacher", any: "home" };   // any = 两边里最后逛到的那一页
const isGuidePage = t => t === "teacher" || t.startsWith("t-");
const mentorVia = {};   // 记住是从哪个业务页进到某位引路人主页的。引路人 id → 业务页
function go(token) {
  const from = current;
  if (token.startsWith("m-") && token !== from) {
    const id = token.slice(2);
    if (from.startsWith("s-" + id + "-")) mentorVia[id] = from; else delete mentorVia[id];
  }
  render(token);
  if (from && from !== current) { trail.push(from); if (trail.length > 60) trail.shift(); }
  // 只记"逛"的页面：首页、东玄西玄、门类、业务、引路人主页。"我的"、申请、协议这些不算，不然切回问路时会落在它们上面
  if (isGuidePage(current)) lastPlace.guide = lastPlace.any = current;
  else if (current === "home" || /^[gdsm]-/.test(current)) lastPlace.seeker = lastPlace.any = current;
  try { if (location.hash !== "#" + current) location.hash = current; } catch (e) {}
}
// "返回"：直接回到你最后逛到的那一页，不会在"我的"、"成为引路人"这些页面之间一格一格地退。
// 只有一个例外：申请页是从介绍页点进来的，所以申请页的返回先回到介绍页。
function goBack() {
  if (current === "apply" && trail[trail.length - 1] === "become") return go("become");
  go(lastPlace.any);
}
const backLink = () => `<a class="back" href="#" data-back>← 返回</a>`;

document.addEventListener("click", e => {
  const link = e.target.closest("[data-go]");
  if (link) { e.preventDefault(); if (link.dataset.after) afterLogin = link.dataset.after; go(link.dataset.go); return; }
  const role = e.target.closest("[data-role]");
  if (e.target.closest("[data-back]")) { e.preventDefault(); goBack(); return; }
  if (role) { go(role.dataset.role === "mentor" ? lastPlace.guide : lastPlace.seeker); return; }   // 切换时回到上次在那一边看的页面
  const up = e.target.closest("[data-upload]"), sh = e.target.closest("[data-shuffle]");
  if (up) { document.getElementById(up.dataset.upload).click(); return; }      // 打开选图片的窗口
  if (sh) {                                                                      // 随机换一款预设，保证和现在的不一样
    const pool = sh.dataset.shuffle === "avatar" ? AVATARS : COVERS, key = sh.dataset.shuffle;
    let next = pick(pool); while (next === desk[key]) next = pick(pool);
    desk[key] = next; document.getElementById("desk-head").innerHTML = deskHeadHtml(); return;
  }
  const id = e.target.id;
  // 测试账号：一键登录
  const test = e.target.dataset.test && TEST_ACCOUNTS[e.target.dataset.test];
  if (test) {
    user.loggedIn = true; user.name = test.name; user.mentorStatus = test.mentorStatus; resetDesk(test.mentorStatus === "approved");
    const to = afterLogin || (user.mentorStatus === "approved" ? "teacher" : "home"); afterLogin = ""; go(to); return;
  }
  // 联系和收藏：没登录就先去登录，登录后回到这一页
  if ((id === "contact-btn" || id === "fav-btn") && !user.loggedIn) { afterLogin = current; go("login"); return; }
  if (id === "contact-btn") document.getElementById("contact-note").hidden = false;
  if (id === "fav-btn") {
    const key = e.target.dataset.key, i = user.favorites.indexOf(key);
    if (i < 0) user.favorites.push(key); else user.favorites.splice(i, 1);
    e.target.textContent = i < 0 ? "已收藏" : "收藏";
  }
  // 登录页：在"密码登录"和"验证码登录"之间切换
  if (id === "login-mode-btn") {
    const a = document.getElementById("login-by-password"), b = document.getElementById("login-by-code"), toCode = b.hidden;
    a.hidden = a.disabled = toCode; b.hidden = b.disabled = !toCode;
    e.target.textContent = toCode ? "改用密码登录" : "改用验证码登录";
  }
  if (id === "send-code-btn") document.getElementById("code-note").hidden = false;
  const ds = e.target.dataset;
  if (ds.svcToggle) { const v = desk.services.find(x => x.domain === ds.svcToggle); v.on = !v.on; render(current); return; }
  if (ds.svcRemove) { desk.services = desk.services.filter(x => x.domain !== ds.svcRemove); if (desk.editing === ds.svcRemove) desk.editing = ""; render(current); return; }
  if (ds.svcEdit) {   // 那张卡片原地变成表单
    desk.editing = ds.svcEdit; render(current);
    const box = document.getElementById("de-summary"); if (box) box.focus({ preventScroll: true });
    return;
  }
  if (ds.svcCancel) { desk.editing = ""; render(current); return; }
  if (ds.req !== undefined && e.target.matches("[data-req]")) { desk.requests[+ds.req].fresh = false; render(current); document.getElementById("req-note").hidden = false; return; }
  if (id === "approve-btn") { user.mentorStatus = "approved"; render("me"); }
  if (id === "logout-btn") { user.loggedIn = false; user.name = ""; user.mentorStatus = "none"; user.favorites = []; trail.length = 0; lastPlace.seeker = lastPlace.any = "home"; lastPlace.guide = "teacher"; resetDesk(false); go("home"); }
});

// 首页搜索：边输入边显示结果
document.addEventListener("input", e => {
  if (e.target.id !== "search-input") return;
  const box = document.getElementById("search-results"), q = e.target.value, res = searchAll(q);
  box.hidden = !q.trim();
  box.innerHTML = res.length
    ? res.map(r => `<a href="#${r.go}" data-go="${r.go}"><span class="tag">${r.type}</span><span><strong>${r.title}</strong><small>${r.sub}</small></span></a>`).join("")
    : `<p>没有找到。换一个词试试。</p>`;
});

// 表单提交：登录、注册、引路人申请、搜索、推荐
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "search-form") { const res = searchAll(document.getElementById("search-input").value); if (res.length) go(res[0].go); return; }
  if (e.target.id === "guide-form") { const box = document.getElementById("guide-result"); box.innerHTML = guideHtml(guideMatch(document.getElementById("guide-text").value)); box.hidden = false; return; }
  const val = id => document.getElementById(id).value.trim();
  const done = () => { const to = afterLogin || (user.mentorStatus === "approved" ? "teacher" : "home"); afterLogin = ""; go(to); };
  const lines = id => val(id).split("\n").map(t => t.trim()).filter(Boolean);
  if (e.target.id === "desk-profile-form") {
    user.name = val("dp-name") || user.name; desk.tagline = val("dp-tagline"); desk.bio = val("dp-bio"); desk.credentials = lines("dp-cred");
    render(current); document.getElementById("dp-saved").hidden = false; return;
  }
  if (e.target.id === "desk-edit-form") {
    const v = desk.services.find(x => x.domain === desk.editing);
    if (v) { v.summary = val("de-summary"); v.offers = lines("de-offers"); }
    desk.editing = ""; render(current); return;
  }
  if (e.target.id === "desk-service-form") {
    const dom = val("ds-domain"), old = desk.services.find(x => x.domain === dom);
    const item = { domain: dom, summary: val("ds-summary"), offers: lines("ds-offers"), on: old ? old.on : true };
    if (old) Object.assign(old, item); else desk.services.push(item);
    render(current); return;
  }
  if (e.target.id === "login-form") {
    const byCode = !document.getElementById("login-by-code").hidden;
    const who = val(byCode ? "login-contact" : "login-id").toLowerCase();
    const test = Object.values(TEST_ACCOUNTS).find(t => t.email === who || t.account === who);
    user.loggedIn = true;
    user.name = test ? test.name : who.split("@")[0];
    user.mentorStatus = test ? test.mentorStatus : "none"; resetDesk(!!test && test.mentorStatus === "approved");
    done();
  }
  if (e.target.id === "register-form") {
    user.loggedIn = true; user.name = val("reg-name");
    done();
  }
  if (e.target.id === "apply-form") {
    const err = document.getElementById("apply-error");
    const fail = msg => { err.textContent = msg; err.hidden = false; };
    if (document.getElementById("apply-inv-yes").checked) {
      // 受邀引路人：邀请码正确就直接认证
      if (val("apply-code").toUpperCase() !== DEMO_INVITE_CODE) return fail("邀请码不正确。请检查后再试，或联系平台。");
      if (!user.loggedIn) { user.loggedIn = true; user.name = val("ap-name"); }   // 没有账号的人，在这里一并注册
      user.mentorStatus = "approved"; go("me");
    } else if (document.getElementById("apply-inv-no").checked) {
      // 非受邀：进入待审核
      if (!DOMAINS.some(d => document.getElementById("apply-d-" + d.id).checked)) return fail("请至少选择一个擅长方向。");
      if (!user.loggedIn) { user.loggedIn = true; user.name = val("ap-name"); }
      user.mentorStatus = "pending"; go("me");
    }
  }
});

// 工作台：选好图片后，直接换上去。原型阶段图片只在本次打开时有效
document.addEventListener("change", e => {
  const key = { "dp-avatar-file": "avatar", "dp-cover-file": "cover" }[e.target.id], file = e.target.files && e.target.files[0];
  if (!key || !file) return;
  const reader = new FileReader();
  reader.onload = () => { desk[key] = reader.result; document.getElementById("desk-head").innerHTML = deskHeadHtml(); };
  reader.readAsDataURL(file);
});

// 引路人申请页：根据第一个问题的回答，显示对应的部分，隐藏另一部分
document.addEventListener("change", e => {
  if (e.target.name !== "apply-invited") return;
  const invited = e.target.value === "yes";
  const a = document.getElementById("apply-invited-part"), b = document.getElementById("apply-normal-part");
  a.hidden = a.disabled = !invited;
  b.hidden = b.disabled = invited;
  document.getElementById("apply-error").hidden = true;
});
window.addEventListener("hashchange", () => {
  const token = location.hash.slice(1);
  if (token !== current) render(token);
});
render(location.hash.slice(1) || "home");
setLang(lang);   // 套用上次选的语言
</script>
